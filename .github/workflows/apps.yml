# Builds the PocketTk window apps (Mac .dmg for Apple Silicon and Intel, Windows installer + zip, Linux .tar.gz for x86_64 and
# aarch64), runs the tests, and attaches the files to a release.
# Push a tag like v4.1.2 to make a release (v4.1.2-rc1 makes a pre-release); run it by hand (Actions > Desktop apps > Run workflow) to just get the files.
name: Desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: python -m unittest tests.test_deps tests.test_gui tests.test_packaging tests.test_termux_connect tests.test_check
      - run: node tests/test_core.js && node tests/test_shell.js

  dmg:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          # The Intel runner. (macos-13 was retired; macos-15-intel is the one GitHub still offers.) If this label is ever
          # retired too, build x86_64 on an Intel Mac with: packaging/macos/build_app.sh x86_64
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the app and the .dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set these repository secrets/variables to sign with a Developer ID and notarize.
          # CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          # NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
        run: packaging/macos/build_app.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: PocketTk-${{ matrix.arch }}-dmg
          path: dist/*.dmg

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Make sure Inno Setup is there
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the app, the zip and the installer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build_app.ps1 -Arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: PocketTk-windows-x64-app
          path: |
            dist/*.zip   # the Windows portable zip and PocketTk-<version>-android.zip
            dist/*-setup.exe

  linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64, experimental: false }
          # aarch64: Qt WebEngine wheels are not available for every Python/Qt combination on arm64. If this one fails it
          # must not stop the release of the other apps (the failure is still shown). Remove "experimental" once it is green.
          - { runner: ubuntu-24.04-arm, arch: aarch64, experimental: true }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      # The arm64 runner image has fewer of these preinstalled than the x86_64 one. Every library Qt WebEngine needs is named in
      # packaging/linux/system-libs.txt (the one list; do not copy it here).
      - name: Libraries Qt WebEngine needs for the self-test
        run: |
          sudo apt-get update
          grep -v '^#' packaging/linux/system-libs.txt | xargs sudo apt-get install -y
      - name: Build the app and the .tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packaging/linux/build_app.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: PocketTk-linux-${{ matrix.arch }}-app
          path: |
            dist/*.tar.gz
            dist/*.AppImage

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make PocketTk-<version>-android.zip (the KernelSU module and the unrooted Termux files)
        run: |
          v=$(sed -n 's/^version=v//p' module.prop)
          mkdir -p dist
          zip -qr "dist/PocketTk-$v-android.zip" . \
            -x ".git/*" ".github/*" "tests/*" "packaging/*" "webui/*" "pockettk_gui.py" "pockettk.cmd" ".gitignore" "*/__pycache__/*" "dist/*"
          unzip -l "dist/PocketTk-$v-android.zip" | tail -3
      - uses: actions/upload-artifact@v4
        with:
          name: PocketTk-android
          path: dist/*-android.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dmg, windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "PocketTk-*", merge-multiple: true, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}      # v4.1.2-rc1 is a pre-release, v4.1.2 is not
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*-setup.exe
            dist/*.tar.gz
            dist/*.AppImage
