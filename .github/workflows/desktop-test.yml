# Tests the desktop side of PocketTk on real Windows, macOS and Linux machines, with nothing to install and no tag needed.
# Run it by hand: Actions > "Desktop test" > Run workflow (works from the phone's browser too). Each job shows a green tick or
# a red cross; open one to read the log. Screenshots, the built APK/AAB and logs are attached to the run as artifacts.
#   unit  : the whole test suite on all three systems (path, shell and encoding problems show up here)
#   gui   : starts the real PocketTk window (pywebview), checks the page and the Python bridge answer, takes a screenshot
#   e2e   : installs the JDK + Android SDK the way the window does on first run, then builds a real APK and .aab
name: Desktop test

on:
  workflow_dispatch:
    inputs:
      gui:
        description: "Open the real window and take a screenshot"
        type: boolean
        default: true
      e2e:
        description: "Install the JDK and Android SDK and build a real APK (about 5-10 minutes each)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  unit:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Python tests
        run: python -m unittest tests.test_deps tests.test_gui tests.test_gui_smoke tests.test_packaging tests.test_termux_connect tests.test_terminal_page tests.test_check -v
      - name: JavaScript tests
        run: |
          node tests/test_core.js
          node tests/test_shell.js

  gui:
    if: ${{ inputs.gui }}
    name: window (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Libraries the Linux window needs (Qt WebEngine, a virtual screen, a screenshot tool)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick
          grep -v '^#' packaging/linux/system-libs.txt | xargs sudo apt-get install -y
      - name: Install pywebview
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install pywebview qtpy PyQt6 PyQt6-WebEngine certifi
          else
            python -m pip install pywebview certifi
          fi
      - name: Open the window, check it, take a screenshot
        shell: bash
        env:
          POCKETTK_GUI_SMOKE: "1"
          POCKETTK_GUI_SMOKE_HOLD: "10"
          PYTHONUNBUFFERED: "1"
          PYWEBVIEW_GUI: ${{ runner.os == 'Linux' && 'qt' || '' }}
          QT_API: pyqt6
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: |
          mkdir -p out
          run_window() { python pockettk_gui.py > out/window.log 2>&1; }
          if [ "$RUNNER_OS" = "Linux" ]; then
            export DISPLAY=:99
            Xvfb :99 -screen 0 1280x900x24 &
            sleep 2
          fi
          run_window &
          PID=$!
          sleep 14                       # the window is open and held for a few more seconds
          case "$RUNNER_OS" in
            macOS)   screencapture -x out/window.png || true;;
            Linux)   import -window root out/window.png || true;;
            Windows) powershell -NoProfile -Command "Add-Type -AssemblyName System.Windows.Forms,System.Drawing; \$b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds; \$bmp=New-Object System.Drawing.Bitmap \$b.Width,\$b.Height; \$g=[System.Drawing.Graphics]::FromImage(\$bmp); \$g.CopyFromScreen(\$b.Location,[System.Drawing.Point]::Empty,\$b.Size); \$bmp.Save('out/window.png')" || true;;
          esac
          wait $PID && CODE=0 || CODE=$?
          echo "---- window.log ----"; cat out/window.log
          { echo "### Window on ${RUNNER_OS}"; echo; echo '```'; tail -n 20 out/window.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "^smoke: ok" out/window.log || CODE=1
          exit $CODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-${{ runner.os }}
          path: out/
          if-no-files-found: warn

  e2e:
    if: ${{ inputs.e2e }}
    name: build an APK (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: First-run setup, then build an APK and a bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: python tests/ci_e2e.py out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-${{ runner.os }}
          path: |
            out/*.apk
            out/*.aab
            out/sample.py
          if-no-files-found: warn
